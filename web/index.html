<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocSite</title>
  <meta name="description" content="极简现代文档展示系统" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/content.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar" aria-label="侧边栏">
      <div class="sidebar__header">
        <div class="brand">
          <span class="brand__logo" id="brandLogo">DS</span>
          <span class="brand__name" id="brandName">DocSite</span>
        </div>
        <button class="icon-btn sidebar__collapse" id="btnCollapse"
                aria-label="折叠侧边栏" title="折叠">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>

      <div class="sidebar__search">
        <svg class="sidebar__search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="searchInput" placeholder="搜索文档…" aria-label="搜索文档" autocomplete="off" />
        <div class="search-results" id="searchResults" hidden></div>
      </div>

      <nav class="sidebar__nav" id="sidebarNav" aria-label="文档导航"></nav>

      <div class="sidebar__footer">
        <button class="icon-btn" id="btnTheme" aria-label="切换主题" title="切换主题"></button>
      </div>
    </aside>

    <!-- 移动端遮罩 -->
    <div class="overlay" id="overlay" hidden></div>

    <!-- 主内容区 -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn topbar__menu" id="btnMobileMenu"
                aria-label="打开菜单" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar__crumb" id="crumb"></span>
        <div class="topbar__spacer"></div>
      </header>

      <div class="content-wrap">
        <article class="content" id="content" tabindex="-1">
          <div class="skeleton">
            <div class="skeleton__title"></div>
            <div class="skeleton__line w80"></div>
            <div class="skeleton__line w100"></div>
            <div class="skeleton__line w60"></div>
          </div>
        </article>
        <aside class="toc" id="toc" aria-label="目录" hidden></aside>
      </div>

      <footer class="docnav" id="docnav"></footer>
    </div>
  </div>

  <script src="/js/markdown.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/search.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
