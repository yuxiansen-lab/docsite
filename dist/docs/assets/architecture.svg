<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" width="620" height="180" role="img" aria-label="DocSite 架构图">
  <style>
    .box { fill: #f6f7f9; stroke: #d5d9e0; stroke-width: 1.5; rx: 10; }
    .accent { fill: rgba(99,102,241,.12); stroke: #6366f1; stroke-width: 1.5; rx: 10; }
    .t { font: 600 13px Inter, system-ui, sans-serif; fill: #1a1d23; }
    .s { font: 11px Inter, system-ui, sans-serif; fill: #5b6472; }
    .a { stroke: #9aa3af; stroke-width: 1.5; fill: none; marker-end: url(#m); }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa3af"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="60" width="130" height="60"/>
  <text class="t" x="75" y="86" text-anchor="middle">浏览器</text>
  <text class="s" x="75" y="104" text-anchor="middle">原生 HTML/CSS/JS</text>

  <rect class="accent" x="200" y="45" width="180" height="90"/>
  <text class="t" x="290" y="76" text-anchor="middle">Go HTTP Server</text>
  <text class="s" x="290" y="96" text-anchor="middle">/api/config · /api/menu</text>
  <text class="s" x="290" y="112" text-anchor="middle">/api/doc · /api/search</text>

  <rect class="box" x="440" y="20" width="165" height="60"/>
  <text class="t" x="522" y="46" text-anchor="middle">embed.FS</text>
  <text class="s" x="522" y="64" text-anchor="middle">docs/ · config/ · web/</text>

  <rect class="box" x="440" y="105" width="165" height="60"/>
  <text class="t" x="522" y="131" text-anchor="middle">Markdown 渲染器</text>
  <text class="s" x="522" y="149" text-anchor="middle">标准库 · 零依赖</text>

  <path class="a" d="M140 90 H200"/>
  <path class="a" d="M380 75 H440"/>
  <path class="a" d="M380 115 H440"/>
</svg>
